name: "vallaquenta/calibre-plugin"
description: "Whitelist events from CWA KoboSync when using CalibreWeb Automated"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "KoboSync on CWA will trigger http-crawl-non_statics"
  expression:
   - evt.Meta.http_status in ['401'] && evt.Meta.http_path contains "/kobo"



