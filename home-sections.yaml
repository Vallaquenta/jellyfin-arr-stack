name: "vallaquenta/homepage-plugin"
description: "Whitelist events from jellyfin when home-sections plugin is active and showing entries from Seerr"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "Jellyfin home-sections plugin requests CachedImage which will trigger http-crawl-non_statics"
  expression:
   - evt.Meta.http_path contains "/HomeScreen/CachedImage"
